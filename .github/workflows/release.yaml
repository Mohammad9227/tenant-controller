# On every v* tag: build and push a multi-arch image to ghcr.io, then create a
# GitHub Release with dist/install.yaml attached, so users can install with
#   kubectl apply -f https://github.com/Mohammad9227/tenant-controller/releases/latest/download/install.yaml
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mohammad9227/tenant-controller:${{ github.ref_name }}
            ghcr.io/mohammad9227/tenant-controller:latest

      - name: Build install.yaml
        run: sh hack/build-installer.sh ${{ github.ref_name }}

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/install.yaml
          generate_release_notes: true
